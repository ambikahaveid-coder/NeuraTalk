[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuratalk"
version = "1.0.0"
description = "Official Python SDK for the NeuraTalk API (real-time translated calling, transcripts, webhooks)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
dependencies = [
    "requests>=2.28,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
