name: neuratalk
description: NeuraTalk - Real-time multilingual voice AI communication
publish_to: 'none'
version: 2.0.0+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.3.3

  # Permissions
  permission_handler: ^11.3.1

  # Device contacts (Contacts sync)
  flutter_contacts: ^1.1.9+2

  # Connectivity
  connectivity_plus: ^7.2.0

  # Page indicator for onboarding
  smooth_page_indicator: ^1.2.0

  # Icons
  cupertino_icons: ^1.0.8

  # Profile photo picker / chat image attachments
  image_picker: ^1.1.2

  # General file attachments (documents, videos, zips) -- image_picker only
  # covers photos/videos from the gallery, not arbitrary files.
  file_picker: ^8.1.6

  # Emoji picker for chat composer
  emoji_picker_flutter: ^3.1.0

  # Real microphone recording for voice messages
  record: ^5.2.0

  # Voice message / attachment playback
  audioplayers: ^6.1.0

  # LiveKit for calls
  livekit_client: ^2.4.3

  # Firebase (phone OTP)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_crashlytics: ^4.1.6
  firebase_messaging: ^15.1.6

  # Native lock-screen incoming-call UI + ringtone (CallKit on iOS,
  # full-screen ringing activity on Android) -- makes incoming calls ring
  # even when the app is backgrounded or fully killed.
  flutter_callkit_incoming: ^2.5.8

  # URL launcher
  url_launcher: ^6.3.1

  # Image
  cached_network_image: ^3.4.1

  # Intl (date formatting)
  intl: ^0.19.0

  # Save/share exported transcript files
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

# record_linux 0.7.2 (transitively pulled by record ^5.2.0) doesn't
# implement the newer record_platform_interface 1.6.0 abstract methods
# (startStream, hasPermission's `request` param), which breaks the Dart
# kernel compile for ALL platforms, not just Linux, since the plugin is
# still statically analyzed. Not app code we own -- Linux desktop isn't a
# build target here; pinning to a version that matches the interface we
# actually resolve to is the standard fix.
dependency_overrides:
  record_linux: ^1.3.0

flutter:
  uses-material-design: true
