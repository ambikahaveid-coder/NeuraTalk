name: neuratalk
description: NeuraTalk - Real-time multilingual voice AI communication
publish_to: 'none'
version: 2.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.2

  # Local storage
  shared_preferences: ^2.3.3

  # Permissions
  permission_handler: ^11.3.1

  # Connectivity
  connectivity_plus: ^7.2.0

  # Page indicator for onboarding
  smooth_page_indicator: ^1.2.0

  # Icons
  cupertino_icons: ^1.0.8

  # Profile photo picker
  image_picker: ^1.1.2

  # LiveKit for calls
  livekit_client: ^2.4.3

  # Firebase (phone OTP)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_crashlytics: ^4.1.6

  # URL launcher
  url_launcher: ^6.3.1

  # Image
  cached_network_image: ^3.4.1

  # Intl (date formatting)
  intl: ^0.19.0

  # Save/share exported transcript files
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
