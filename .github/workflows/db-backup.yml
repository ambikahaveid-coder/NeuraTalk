name: Database backup

# The production database is AWS RDS in Mumbai (neuratalk-prod-db), private to
# the app. RDS already keeps automatic backups with point-in-time restore for
# 14 days. On top of that, this takes a nightly snapshot, kept 35 days, and the
# 1st-of-month snapshot is kept ~13 months. Snapshots are encrypted and stay in
# Mumbai. Restore steps: docs/operations/DATABASE_BACKUP_AND_RESTORE.md
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

concurrency:
  group: neuratalk-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::132597215158:role/NeuraTalkGitHubProdDeploy
          aws-region: ap-south-1
      - name: Snapshot, wait, prune
        run: |
          set -euo pipefail
          DB=neuratalk-prod-db
          DAY="$(date -u +%Y-%m-%d)"
          KIND=nightly
          if [ "$(date -u +%d)" = "01" ]; then KIND=monthly; fi
          ID="neuratalk-$KIND-$DAY-$(date -u +%H%M)"
          aws rds create-db-snapshot --db-instance-identifier "$DB" --db-snapshot-identifier "$ID" \
            --tags Key=app,Value=neuratalk Key=backup,Value="$KIND" --query DBSnapshot.Status --output text
          aws rds wait db-snapshot-available --db-snapshot-identifier "$ID"
          echo "Snapshot $ID is available"
          # Prune: nightly older than 35 days, monthly older than 90 days.
          prune() {
            local prefix="$1" days="$2" cutoff
            cutoff="$(date -u -d "-$days days" +%Y-%m-%dT%H:%M:%S)"
            aws rds describe-db-snapshots --db-instance-identifier "$DB" --snapshot-type manual \
              --query "DBSnapshots[?starts_with(DBSnapshotIdentifier, '$prefix') && SnapshotCreateTime<'$cutoff'].DBSnapshotIdentifier" \
              --output text | tr '\t' '\n' | while read -r old; do
                [ -n "$old" ] && aws rds delete-db-snapshot --db-snapshot-identifier "$old" --output text >/dev/null && echo "Deleted $old"
              done
          }
          prune neuratalk-nightly- 35
          prune neuratalk-monthly- 90
