##############################################################################
# RTPEngine Configuration — NeuraTalk Media Proxy
#
# RTPEngine handles:
#   - RTP proxy between PSTN carrier and WebRTC/SIP clients
#   - RTP forking → AI workers (STT/translation pipeline)
#   - SRTP ↔ RTP transcoding (PSTN carrier ↔ browser WebRTC)
#   - G.711 ↔ Opus transcoding (carrier ↔ LiveKit)
#   - NAT traversal (ICE/STUN for WebRTC)
#   - RTP statistics (per-call packet loss, jitter, RTT)
#
# Start command:
#   rtpengine --config-file=/etc/rtpengine/rtpengine.conf
#
# Or via Docker:
#   docker run --net=host drachtio/rtpengine \
#     --config-file=/etc/rtpengine/rtpengine.conf
##############################################################################

[rtpengine]

# Interface configuration
# format: <local_ip>!<public_ip>  (for NAT traversal)
# If no NAT: interface = 0.0.0.0
interface = $PRIVATE_IP!$PUBLIC_IP

# ng control protocol socket (Kamailio talks to us here)
listen-ng = 127.0.0.1:22222

# HTTP API for statistics and control
listen-http = 127.0.0.1:8088

# Prometheus metrics endpoint
listen-prometheus = 127.0.0.1:9309

# UDP port range for RTP streams
# Each call uses 2 ports (RTP + RTCP). 4000 ports = 2000 concurrent legs.
port-min = 30000
port-max = 40000

# Logging
log-level = 4
log-facility = daemon

# Process settings
foreground = false
pidfile = /var/run/rtpengine/rtpengine.pid

# Table size (number of concurrent calls)
# Each RTP session needs a table entry
table = 0

# Timeout for idle RTP sessions (seconds)
timeout = 60

# Silent timeout (no RTP traffic) — trigger after this many seconds
silent-timeout = 3600

# Final timeout (absolute max per-session)
final-timeout = 10800

# ── Codec settings ────────────────────────────────────────────────────────
# Codecs to accept from carriers (G.711 PCMU/PCMA = standard PSTN)
# WebRTC clients use Opus — RTPEngine handles the transcoding
codec-accept = PCMU PCMA telephone-event

# Codecs to offer to WebRTC clients
codec-offer = PCMU PCMA Opus telephone-event

# ── SRTP settings ─────────────────────────────────────────────────────────
# SRTP for WebRTC legs (DTLS-SRTP)
# PSTN carriers typically send plain RTP — RTPEngine bridges the gap
# sdes-no = disable SDES key exchange (use DTLS only for WebRTC)

# ── Kernel forwarding (bare metal only) ──────────────────────────────────
# For best performance on bare metal, enable kernel RTP forwarding:
#   table = 0
# On Docker/VM, use userspace forwarding (safer, works without kernel module):
#   no-fallback = false
# For Docker deployment, comment out table and use:
no-fallback = false

# ── Recording (for TRAI compliance) ──────────────────────────────────────
# RTPEngine can record calls to files or forward to recording server
# record-call = yes
# recording-dir = /var/lib/rtpengine/recordings
# recording-method = pcap

# ── TLS for ng control protocol ──────────────────────────────────────────
# tls-verify-cert = no
# tls-cert = /etc/rtpengine/tls/cert.pem
# tls-key = /etc/rtpengine/tls/key.pem
