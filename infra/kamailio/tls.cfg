##############################################################################
# Kamailio TLS Configuration — NeuraTalk SIP Core
#
# Loaded by kamailio.cfg when WITH_TLS is defined.
# Certificates must be provisioned before starting Kamailio.
#
# For Let's Encrypt:
#   certbot certonly --standalone -d sip.neuratalk.in
#   tls_cert_file = /etc/letsencrypt/live/sip.neuratalk.in/fullchain.pem
#   tls_private_key = /etc/letsencrypt/live/sip.neuratalk.in/privkey.pem
##############################################################################

[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
certificate = /etc/kamailio/tls/cert.pem
private_key = /etc/kamailio/tls/key.pem
ca_list = /etc/kamailio/tls/ca.pem
cipher_list = ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:RSA+AESGCM:RSA+AES:!aNULL:!MD5:!DSS
server_name = $env(KAMAILIO_DOMAIN)
server_name_mode = 0
server_id = neuratalk-sbc

[server:carriers]
# Mutual TLS for carrier-to-carrier connections
method = TLSv1.2+
verify_certificate = yes
require_certificate = yes
certificate = /etc/kamailio/tls/cert.pem
private_key = /etc/kamailio/tls/key.pem
ca_list = /etc/kamailio/tls/carrier-ca.pem
server_name = $env(KAMAILIO_DOMAIN)

[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
certificate = /etc/kamailio/tls/cert.pem
private_key = /etc/kamailio/tls/key.pem
server_name = $env(KAMAILIO_DOMAIN)
