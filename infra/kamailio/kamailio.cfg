##############################################################################
# NeuraTalk Kamailio SIP Core — Production Configuration
# Version: 5.8+   Target OS: Ubuntu 24.04
#
# Architecture:
#   PSTN/SIP Carriers → Kamailio (SBC+LCR) → RTPEngine (RTP proxy/fork)
#                                           → FreeSWITCH (B2BUA/media GW)
#                                           → NeuraTalk AI (via ESL/RPC)
#
# Operating Modes:
#   Consumer:   App ↔ App | App ↔ Mobile | Web ↔ Mobile
#   Enterprise: Carrier → Kamailio → AI Fork → Existing PBX
#
# Environment Variables (all required unless marked optional):
#   KAMAILIO_DOMAIN       SIP domain (e.g. sip.neuratalk.in)
#   KAMAILIO_PUBLIC_IP    Public IP of this server
#   KAMAILIO_PRIVATE_IP   Private/LAN IP (set same as public if no NAT)
#   RTPENGINE_HOST        RTPEngine host:ng-port (e.g. 127.0.0.1:22222)
#   FREESWITCH_HOST       FreeSWITCH SIP URI host (e.g. 10.0.0.5)
#   FREESWITCH_PORT       FreeSWITCH SIP port (default 5080)
#   NEURATALK_API_HOST    Node.js API host (e.g. 10.0.0.3:3000)
#   KAMAILIO_DB_URL       MySQL/PgSQL URL for usrloc/auth (optional)
#   KAMAILIO_TLS_CERT     Path to TLS certificate
#   KAMAILIO_TLS_KEY      Path to TLS private key
#   KAMAILIO_MI_PORT      MI HTTP port (default 8080)
#   KAMAILIO_LOG_LEVEL    Log level 1-5 (default 2)
##############################################################################

#!KAMAILIO

##############################################################################
# PREPROCESSOR DEFINITIONS
##############################################################################

# SIP domain — used in From/To/Route header matching
#!define KAMAILIO_DOMAIN   "$env(KAMAILIO_DOMAIN)"
#!define PUBLIC_IP          "$env(KAMAILIO_PUBLIC_IP)"
#!define PRIVATE_IP         "$env(KAMAILIO_PRIVATE_IP)"

# Ports
#!define SIP_UDP_PORT       5060
#!define SIP_TCP_PORT       5060
#!define SIP_TLS_PORT       5061
#!define MI_HTTP_PORT       8080

# Downstream services
#!define RTPENGINE_ADDR     "$env(RTPENGINE_HOST)"
#!define FSS_HOST           "$env(FREESWITCH_HOST)"
#!define FSS_PORT           "$env(FREESWITCH_PORT)"
#!define API_HOST           "$env(NEURATALK_API_HOST)"

# Dispatcher groups
#!define GRP_PSTN_PRIMARY   1
#!define GRP_PSTN_FALLBACK  2
#!define GRP_FREESWITCH     3
#!define GRP_ENTERPRISE_PBX 4

# Feature flags (set to 1 to enable)
#!define WITH_TLS            1
#!define WITH_ANTIFLOOD      1
#!define WITH_AUTH           1
#!define WITH_NAT            1
#!define WITH_RTPENGINE      1
#!define WITH_DISPATCHER     1
#!define WITH_DIALOG         1
#!define WITH_REGISTRAR      1
#!define WITH_XMLRPC         0

##############################################################################
# GLOBAL PARAMETERS
##############################################################################

# Logging
debug=2
log_stderror=no
log_facility=LOG_LOCAL0
log_prefix="[KAMAILIO] "

# Process count (2× CPU cores recommended)
fork=yes
children=8

# Ports and transport
port=SIP_UDP_PORT
listen=udp:PRIVATE_IP:SIP_UDP_PORT advertise PUBLIC_IP:SIP_UDP_PORT
listen=tcp:PRIVATE_IP:SIP_TCP_PORT advertise PUBLIC_IP:SIP_TCP_PORT
#!ifdef WITH_TLS
listen=tls:PRIVATE_IP:SIP_TLS_PORT advertise PUBLIC_IP:SIP_TLS_PORT
#!endif

# Routing / processing limits
max_while_loops=500
tcp_connection_lifetime=600
tcp_max_connections=2048
shm_mem_size=256
pkg_mem_size=16

# DNS
dns=yes
rev_dns=no
dns_try_ipv6=no
dns_retr_time=2
dns_retr_no=3

# SIP identity
server_header="Server: NeuraTalk-SBC/1.0"
user_agent_header="User-Agent: NeuraTalk-SBC/1.0"

##############################################################################
# MODULES
##############################################################################

# Module search path
mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

# ── Core ──────────────────────────────────────────────────────────────────
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "kex.so"
loadmodule "corex.so"

# ── Transport ─────────────────────────────────────────────────────────────
#!ifdef WITH_TLS
loadmodule "tls.so"
#!endif

# ── Auth ─────────────────────────────────────────────────────────────────
#!ifdef WITH_AUTH
loadmodule "auth.so"
loadmodule "auth_db.so"
#!endif

# ── NAT & RTP ─────────────────────────────────────────────────────────────
#!ifdef WITH_NAT
loadmodule "nathelper.so"
loadmodule "path.so"
#!endif
#!ifdef WITH_RTPENGINE
loadmodule "rtpengine.so"
#!endif

# ── Dispatcher / LCR ─────────────────────────────────────────────────────
#!ifdef WITH_DISPATCHER
loadmodule "dispatcher.so"
#!endif

# ── Dialog ────────────────────────────────────────────────────────────────
#!ifdef WITH_DIALOG
loadmodule "dialog.so"
#!endif

# ── IP / Flood protection ─────────────────────────────────────────────────
#!ifdef WITH_ANTIFLOOD
loadmodule "htable.so"
loadmodule "pike.so"
#!endif

# ── Management Interface ──────────────────────────────────────────────────
loadmodule "xhttp.so"
loadmodule "mi_http.so"
loadmodule "mi_fifo.so"

# ── Utilities ─────────────────────────────────────────────────────────────
loadmodule "statistics.so"
loadmodule "jsonrpcs.so"
loadmodule "uac.so"

##############################################################################
# MODULE PARAMETERS
##############################################################################

# ── TM (Transaction Manager) ──────────────────────────────────────────────
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)
modparam("tm", "restart_fr_on_each_reply", 0)
modparam("tm", "onreply_avp_mode", 1)

# ── Record-Route ──────────────────────────────────────────────────────────
modparam("rr", "enable_full_lr", 0)
modparam("rr", "append_fromtag", 1)

# ── Usrloc (registration store) ──────────────────────────────────────────
# db_mode=0: memory only (stateless, fast — use for dev)
# db_mode=2: write-through to DB (use for production multi-node)
modparam("usrloc", "db_mode", 0)
modparam("usrloc", "use_domain", 1)

# ── Registrar ─────────────────────────────────────────────────────────────
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "min_expires", 60)
modparam("registrar", "default_expires", 300)
modparam("registrar", "append_branches", 0)
modparam("registrar", "use_path", 1)
modparam("registrar", "path_mode", 0)

# ── Auth DB ───────────────────────────────────────────────────────────────
#!ifdef WITH_AUTH
modparam("auth_db", "db_url",      "$env(KAMAILIO_DB_URL)")
modparam("auth_db", "user_column", "username")
modparam("auth_db", "domain_column","domain")
modparam("auth_db", "pass_column", "password")
modparam("auth_db", "calculate_ha1", 1)
modparam("auth_db", "password_column_2", "ha1")
modparam("auth_db", "use_domain",  1)
#!endif

# ── NAT / nathelper ──────────────────────────────────────────────────────
#!ifdef WITH_NAT
modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "ping_nated_only", 1)
modparam("nathelper", "sipping_bflag", FLB_NATSIPPING)
modparam("nathelper", "sipping_from", "sip:pinger@KAMAILIO_DOMAIN")
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("usrloc", "nat_bflag", FLB_NATB)
#!endif

# ── RTPEngine ─────────────────────────────────────────────────────────────
#!ifdef WITH_RTPENGINE
modparam("rtpengine", "rtpengine_sock", "udp:RTPENGINE_ADDR")
modparam("rtpengine", "setid_avp", "$avp(RTPE_SET)")
# Enable RTP statistics collection
modparam("rtpengine", "extra_id_pv", "$avp(RTPE_ID)")
#!endif

# ── Dispatcher (LCR) ──────────────────────────────────────────────────────
#!ifdef WITH_DISPATCHER
# db_mode=0: load from file at startup, reloadable via MI
# db_mode=1: DB-backed (use for production with dynamic trunk management)
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "db_mode", 0)
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "dst_avp", "$avp(DSTS)")
modparam("dispatcher", "grp_avp", "$avp(DGRP)")
modparam("dispatcher", "cnt_avp", "$avp(DCNT)")
modparam("dispatcher", "sock_avp", "$avp(DSCK)")
# Active health probing via SIP OPTIONS
modparam("dispatcher", "probing_mode", 1)
modparam("dispatcher", "probing_interval", 30)
modparam("dispatcher", "probing_from", "sip:probe@KAMAILIO_DOMAIN")
modparam("dispatcher", "probing_reply_codes", "200,301,302,486,487,404")
modparam("dispatcher", "dst_avp", "$avp(DSTS)")
modparam("dispatcher", "grp_avp", "$avp(DGRP)")
modparam("dispatcher", "cnt_avp", "$avp(DCNT)")
#!endif

# ── Dialog ────────────────────────────────────────────────────────────────
#!ifdef WITH_DIALOG
modparam("dialog", "dlg_flag", 4)
modparam("dialog", "timeout_avp", "$avp(DLG_TIMEOUT)")
modparam("dialog", "default_timeout", 10800)
modparam("dialog", "profiles_with_value", "caller;callee;enterprise")
modparam("dialog", "send_bye", 1)
#!endif

# ── Flood protection ──────────────────────────────────────────────────────
#!ifdef WITH_ANTIFLOOD
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("pike", "remove_latency", 4)
modparam("htable", "htable", "ipban=>size=8;autoexpire=300")
modparam("htable", "htable", "calls=>size=8;autoexpire=7200")
#!endif

# ── Management Interface ──────────────────────────────────────────────────
modparam("mi_http", "port", MI_HTTP_PORT)
modparam("mi_fifo", "fifo_name", "/var/run/kamailio/kamailio_fifo")
modparam("mi_fifo", "fifo_mode", 0666)

# ── Statistics ────────────────────────────────────────────────────────────
modparam("statistics", "variable", "rcv_requests")
modparam("statistics", "variable", "fwd_requests")
modparam("statistics", "variable", "failed_auth")

##############################################################################
# BRANCH FLAGS
##############################################################################
#!define FLB_NATB             1
#!define FLB_NATSIPPING       2
#!define FLB_RTP_RELAY        4
#!define FLB_ENTERPRISE       8

##############################################################################
# REQUEST ROUTING — MAIN
##############################################################################

request_route {

    # ── Max-Forwards guard ─────────────────────────────────────────────
    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # ── Sanity checks ─────────────────────────────────────────────────
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP message from $si — dropping\n");
        exit;
    }

    # ── Flood protection ──────────────────────────────────────────────
    route(ANTIFLOOD);

    # ── Loose-route (in-dialog requests) ──────────────────────────────
    if (has_totag()) {
        if (loose_route()) {
            route(WITHINDLG);
            exit;
        } else {
            if (is_method("ACK")) {
                if (t_check_trans()) {
                    t_relay();
                    exit;
                } else {
                    exit;
                }
            }
            sl_send_reply("404", "Not here");
            exit;
        }
    }

    # ── Handle CANCEL ─────────────────────────────────────────────────
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    # ── Strip Route headers added by previous proxies ──────────────────
    t_check_trans();

    # ── OPTIONS — health-check auto-response ──────────────────────────
    if (is_method("OPTIONS")) {
        route(OPTIONS_REPLY);
        exit;
    }

    # ── REGISTER ──────────────────────────────────────────────────────
    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    # ── Record-Route for INVITE ────────────────────────────────────────
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # ── Route INVITE / other initial requests ─────────────────────────
    route(MAIN_DISPATCH);
}

##############################################################################
# ANTIFLOOD — Pike-based DDoS protection
##############################################################################
route[ANTIFLOOD] {
#!ifdef WITH_ANTIFLOOD
    # Check if source IP is banned
    if ($sht(ipban=>$si) != $null) {
        xlog("L_WARN", "BLOCKED: Banned IP $si\n");
        exit;
    }

    if (!pike_check_req()) {
        xlog("L_ALERT", "FLOOD: Banning $si due to too many requests\n");
        $sht(ipban=>$si) = 1;
        exit;
    }
#!endif
    return;
}

##############################################################################
# OPTIONS REPLY — Respond 200 to keep-alive / health probes
##############################################################################
route[OPTIONS_REPLY] {
    # Dispatcher OPTIONS probes — auto-reply 200
    if (is_domain_local("$rd")) {
        sl_send_reply("200", "OK");
        exit;
    }
    # External OPTIONS (carrier health probes) — relay
    if (!t_relay()) {
        sl_reply_error();
    }
}

##############################################################################
# REGISTRAR — Handle SIP REGISTER
##############################################################################
route[REGISTRAR] {
    # ── Auth ──────────────────────────────────────────────────────────
#!ifdef WITH_AUTH
    if (!auth_check("KAMAILIO_DOMAIN", "subscriber", "1")) {
        auth_challenge("KAMAILIO_DOMAIN", "0");
        exit;
    }
    # Clear auth header before forwarding
    if (!is_method("REGISTER") || !save("location")) {
        sl_reply_error();
    }
    exit;
#!else
    if (!save("location")) {
        sl_reply_error();
    }
    exit;
#!endif
}

##############################################################################
# MAIN DISPATCH — Determine call type and route accordingly
##############################################################################
route[MAIN_DISPATCH] {

    # ── Validate request URI ───────────────────────────────────────────
    if (!is_method("INVITE")) {
        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }

    # ── NAT detection ─────────────────────────────────────────────────
    route(NATDETECT);

    # ── Dialog tracking for all INVITE ────────────────────────────────
#!ifdef WITH_DIALOG
    dlg_manage();
#!endif

    # ── Classify call type by X-NeuraTalk-Mode header ─────────────────
    # Node.js adds this header when forwarding INVITE to Kamailio
    if (is_present_hf("X-NeuraTalk-Mode")) {
        $var(mode) = $hdr(X-NeuraTalk-Mode);
        if ($var(mode) == "enterprise") {
            route(ENTERPRISE_ROUTING);
            exit;
        }
    }

    # ── Check if destination is a registered SIP client ──────────────
    if (lookup("location")) {
        # Known user — consumer app-to-app call
        route(CONSUMER_ROUTING);
        exit;
    }

    # ── DID routing — inbound from PSTN carrier ───────────────────────
    if (is_domain_local("$rd")) {
        route(DID_ROUTING);
        exit;
    }

    # ── Outbound to PSTN — Least Cost Routing ─────────────────────────
    route(LCR_ROUTING);
}

##############################################################################
# CONSUMER ROUTING — App ↔ App | App ↔ Mobile
##############################################################################
route[CONSUMER_ROUTING] {
    xlog("L_INFO", "CONSUMER: $fu → $tu via $branch_uri\n");

    # Setup RTPEngine for media relay
    route(RTPENGINE_OFFER);

    # Add Path / NAT headers
    route(NATMANAGE);

    # Set dialog profile
#!ifdef WITH_DIALOG
    $dlg_val(call_type) = "consumer";
#!endif

    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

##############################################################################
# ENTERPRISE ROUTING — Transparent AI Overlay
# Flow: Carrier → Kamailio → RTPEngine (fork→AI) → Existing PBX → Agent
##############################################################################
route[ENTERPRISE_ROUTING] {
    xlog("L_INFO", "ENTERPRISE: $fu → $tu [overlay]\n");

    # Tag as enterprise for flag-based processing in onreply
    setbflag(FLB_ENTERPRISE);

#!ifdef WITH_DIALOG
    $dlg_val(call_type)      = "enterprise";
    $dlg_val(org_id)         = $hdr(X-NeuraTalk-OrgId);
    $dlg_val(number_id)      = $hdr(X-NeuraTalk-NumberId);
#!endif

    # Setup RTPEngine with AI fork enabled
    route(RTPENGINE_OFFER_ENTERPRISE);

    # Route to the enterprise's PBX (stored in X-NeuraTalk-PBX header)
    $var(pbx) = $hdr(X-NeuraTalk-PBX);
    if ($var(pbx) == $null) {
        # Fallback: route through FreeSWITCH B2BUA
        $var(pbx) = "sip:FSS_HOST:FSS_PORT";
    }

    $ru = $var(pbx);
    route(RELAY);
}

##############################################################################
# DID ROUTING — Inbound PSTN → NeuraTalk
# Routes inbound PSTN calls to the correct user/department
##############################################################################
route[DID_ROUTING] {
    xlog("L_INFO", "DID: Inbound to $rU from $fu\n");

    # Forward to Node.js API for DID lookup + user routing
    # Node.js handles: DID→user lookup, push notification, LiveKit room creation
    $du = "sip:API_HOST;transport=tcp";

    # Add caller info headers for the API
    append_hf("X-Caller-Number: $fU\r\n");
    append_hf("X-Called-DID: $rU\r\n");

    route(RTPENGINE_OFFER);
    route(RELAY);
}

##############################################################################
# LCR ROUTING — Outbound to PSTN via Dispatcher
##############################################################################
route[LCR_ROUTING] {
    xlog("L_INFO", "LCR: Outbound $fU → $rU\n");

#!ifdef WITH_DISPATCHER
    # Try primary PSTN group first (Jio, Airtel priority-ordered)
    if (!ds_select_dst(GRP_PSTN_PRIMARY, "4")) {
        # All primary trunks down — try fallback (Tata, MSG91, Twilio)
        if (!ds_select_dst(GRP_PSTN_FALLBACK, "4")) {
            xlog("L_CRIT", "LCR: ALL TRUNKS DOWN for $rU\n");
            sl_send_reply("503", "No Route — All Trunks Unavailable");
            exit;
        }
    }

    xlog("L_INFO", "LCR: Selected trunk $du for $rU\n");
    route(RTPENGINE_OFFER);
    route(RELAY);
#!else
    sl_send_reply("503", "Dispatcher Not Enabled");
    exit;
#!endif
}

##############################################################################
# IN-DIALOG ROUTING — ACK, BYE, re-INVITE, etc.
##############################################################################
route[WITHINDLG] {

    if (is_method("BYE")) {
#!ifdef WITH_RTPENGINE
        rtpengine_delete();
#!endif
        # Update dialog statistics
        update_stat("rcv_requests", "+1");
    }

    if (is_method("INVITE")) {
        # re-INVITE — update RTPEngine with new SDP
        route(RTPENGINE_OFFER);
    }

    route(NATMANAGE);
    route(RELAY);
}

##############################################################################
# RELAY — Generic SIP relay with NAT management
##############################################################################
route[RELAY] {
    route(NATMANAGE);

    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

##############################################################################
# RTPENGINE OFFER — Standard consumer call
##############################################################################
route[RTPENGINE_OFFER] {
#!ifdef WITH_RTPENGINE
    if (is_method("INVITE") && has_body("application/sdp")) {
        rtpengine_manage("replace-origin replace-session-connection trust-address SDES-off ICE=remove codec-mask=all codec-transcode=PCMU");
        setbflag(FLB_RTP_RELAY);
    }
#!endif
    return;
}

##############################################################################
# RTPENGINE OFFER — Enterprise call with AI fork
##############################################################################
route[RTPENGINE_OFFER_ENTERPRISE] {
#!ifdef WITH_RTPENGINE
    if (is_method("INVITE") && has_body("application/sdp")) {
        # Fork RTP to the AI worker (RTP worker listens on :7000)
        # rtpengine_manage flags: replace SDP + add media fork target
        rtpengine_manage("replace-origin replace-session-connection trust-address SDES-off ICE=remove codec-mask=all codec-transcode=PCMU media-address=PUBLIC_IP");
        setbflag(FLB_RTP_RELAY);
        setbflag(FLB_ENTERPRISE);
    }
#!endif
    return;
}

##############################################################################
# NAT DETECTION
##############################################################################
route[NATDETECT] {
#!ifdef WITH_NAT
    force_rport();
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            fix_nated_contact();
        }
        setflag(FLT_NATS);
    }
#!endif
    return;
}

##############################################################################
# NAT MANAGEMENT — Fix contacts/SDP for NATed clients
##############################################################################
route[NATMANAGE] {
#!ifdef WITH_NAT
    if (is_request()) {
        if (isflagset(FLT_NATS)) {
            force_rport();
        }
    }
    if (isbflagset(FLB_NATB)) {
        if (is_request()) {
            fix_nated_contact();
        } else {
            fix_nated_contact();
        }
    }
#!endif
    return;
}

##############################################################################
# REPLY ROUTING — Handle 200 OK and other responses
##############################################################################
onreply_route {
    # RTPEngine: process answer SDP in 200 OK
#!ifdef WITH_RTPENGINE
    if (isbflagset(FLB_RTP_RELAY) && has_body("application/sdp")) {
        if (isbflagset(FLB_ENTERPRISE)) {
            rtpengine_manage("replace-origin replace-session-connection trust-address SDES-off ICE=force codec-mask=all");
        } else {
            rtpengine_manage("replace-origin replace-session-connection trust-address SDES-off ICE=remove codec-mask=all");
        }
    }
#!endif

    # NAT fix on 200 OK Contact
#!ifdef WITH_NAT
    if (nat_uac_test("1")) {
        fix_nated_contact();
    }
#!endif
}

##############################################################################
# FAILURE ROUTING — Provider failover
##############################################################################
failure_route[FAILOVER] {
    if (t_is_canceled()) {
        exit;
    }

    # On 503 / timeout — try next dispatcher destination
    if (t_check_status("503") || t_branch_timeout()) {
#!ifdef WITH_DISPATCHER
        if (ds_next_dst()) {
            xlog("L_WARN", "FAILOVER: Trying next trunk for $rU\n");
            t_on_failure("FAILOVER");
            route(RELAY);
        } else {
            xlog("L_CRIT", "FAILOVER: No more trunks for $rU — exhausted\n");
            t_reply("503", "All Trunks Exhausted");
        }
#!endif
        exit;
    }

    # On 408 timeout — try next destination
    if (t_check_status("408")) {
#!ifdef WITH_DISPATCHER
        ds_mark_dst("p");
        if (ds_next_dst()) {
            xlog("L_WARN", "FAILOVER: Timeout — trying next trunk for $rU\n");
            t_on_failure("FAILOVER");
            route(RELAY);
            exit;
        }
#!endif
    }
}

##############################################################################
# LOCAL FLAG DEFINITIONS (for feature flags not defined above)
##############################################################################
#!define FLT_NATS 5
