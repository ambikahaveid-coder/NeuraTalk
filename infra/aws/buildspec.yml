version: 0.2
env:
  variables:
    AWS_ACCOUNT_ID: "132597215158"
    AWS_REGION: "ap-south-1"
    IMAGE_REPO_NAME: "neuratalk"
phases:
  pre_build:
    commands:
      - echo "Build started on $(date)"
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - "IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | cut -d: -f2)"
      - echo "Immutable test tag will be $IMAGE_TAG"
      - 'echo "Source commit provenance: GIT_COMMIT_SHA=${GIT_COMMIT_SHA:-unset}"'
  build:
    commands:
      - echo "Building Docker image (no production secrets passed)..."
      - docker build --build-arg GIT_COMMIT_SHA=$GIT_COMMIT_SHA -t $IMAGE_REPO_NAME .
      - echo "Docker build succeeded. Tagging immutable image..."
      - docker tag $IMAGE_REPO_NAME:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - echo "Pushing immutable tag only (not :latest)..."
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
  post_build:
    commands:
      - echo "Build complete. Immutable tag = $IMAGE_TAG"
      - echo "--- ffmpeg verification ---"
      - docker run --rm $IMAGE_REPO_NAME sh -c "ffmpeg -version | head -1"
      - echo "--- runtime metadata ---"
      - docker run --rm $IMAGE_REPO_NAME sh -c "node --version; echo PORT=\$PORT; echo NODE_ENV=\$NODE_ENV"
      - echo "--- secret-exclusion scan (filenames only, no content) ---"
      - docker run --rm $IMAGE_REPO_NAME sh -c "find /app -iname '*.env*' -o -iname '*service-account*.json' -not -iname '*.example.json' -o -iname '*credentials*.json' -not -iname '*.example.json' -o -iname '*.jks' -o -iname '*.keystore' -o -iname 'key.properties' -o -iname '*.pem' -o -iname '.git' 2>/dev/null; echo 'secret scan complete'"
      - echo "IMAGE_DIGEST=$(aws ecr describe-images --repository-name $IMAGE_REPO_NAME --image-ids imageTag=$IMAGE_TAG --region $AWS_REGION --query 'imageDetails[0].imageDigest' --output text)"
      - echo "IMAGE_SIZE_BYTES=$(aws ecr describe-images --repository-name $IMAGE_REPO_NAME --image-ids imageTag=$IMAGE_TAG --region $AWS_REGION --query 'imageDetails[0].imageSizeInBytes' --output text)"
