services:
  - name: web
    github:
      repo: ambikahaveid-coder/NeuraTalk
      branch: neuratalk-clean-release
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: npm run db:push && node dist/index.cjs
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 5000
    health_check:
      http_path: /healthz
      initial_delay_seconds: 30
