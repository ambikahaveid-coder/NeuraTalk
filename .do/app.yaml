    value: "NeuraTalk@Admin2025!Secure"
    scope: RUN_TIME

  # ── Domain / CORS ────────────────────────────────────────────────────────────
  - key: APP_BASE_URL
    value: https://neuratalk.in
    scope: RUN_TIME
  - key: BASE_URL
    value: https://neuratalk.in
    scope: RUN_TIME
  - key: FRONTEND_URL
    value: https://neuratalk.in
    scope: RUN_TIME
  - key: ALLOWED_ORIGINS
    value: https://neuratalk.in
    scope: RUN_TIME

