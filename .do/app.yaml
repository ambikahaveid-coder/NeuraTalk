  - key: VITE_FIREBASE_API_KEY
    value: AIzaSyDMn1dPIAAAdYiFSiAzUG65dg1o85w_A7Q
    scope: RUN_AND_BUILD_TIME
  - key: VITE_FIREBASE_AUTH_DOMAIN
