name: neuratalk
region: blr
envs:
  # ── Runtime flags ────────────────────────────────────────────────────────────
  - key: NODE_ENV
    value: production
    scope: RUN_AND_BUILD_TIME
  - key: PORT
    value: "5000"
    scope: RUN_TIME
  - key: ENABLE_STARTUP_SEEDING
    value: "true"
    scope: RUN_TIME
  - key: PREFER_LOCAL_AI
    value: "false"
    scope: RUN_TIME

  # ── Auth / OTP ───────────────────────────────────────────────────────────────
  - key: PHONE_OTP_PROVIDER
    value: firebase
    scope: RUN_AND_BUILD_TIME
  - key: VITE_PHONE_OTP_PROVIDER
    value: firebase
    scope: RUN_AND_BUILD_TIME

  # ── Azure Speech / STT ───────────────────────────────────────────────────────
  - key: STT_PROVIDER
    value: azure
    scope: RUN_TIME
  - key: ENABLE_DEEPGRAM_STT_FALLBACK
    value: "true"
    scope: RUN_TIME
  - key: AZURE_SPEECH_REGION
    value: centralindia
    scope: RUN_TIME
  - key: AZURE_TRANSLATOR_REGION
    value: centralindia
    scope: RUN_TIME

  # ── LiveKit (non-secret config) ──────────────────────────────────────────────
  - key: LIVEKIT_URL
    value: wss://neuratalk-vzgep7qq.livekit.cloud
    scope: RUN_TIME
  - key: LIVEKIT_SIP_DOMAIN
    value: 1m2u036kt9m.sip.livekit.cloud
    scope: RUN_TIME

  # ── OpenAI (non-secret base URL) ─────────────────────────────────────────────
  - key: AI_INTEGRATIONS_OPENAI_BASE_URL
    value: https://api.openai.com/v1
    scope: RUN_TIME

  # ── Domain / CORS ────────────────────────────────────────────────────────────
  - key: APP_BASE_URL
    value: https://neuratalk.in
    scope: RUN_TIME
  - key: BASE_URL
    value: https://neuratalk.in
    scope: RUN_TIME
  - key: FRONTEND_URL
    value: https://neuratalk.in
    scope: RUN_TIME
  - key: ALLOWED_ORIGINS
    value: https://neuratalk.in
    scope: RUN_TIME

  # ── Firebase client SDK (build-time — these are public client-side identifiers)
  # Firebase client config is NOT secret: https://firebase.google.com/docs/projects/api-keys
  # Security is enforced via Firebase Auth domain allowlist + security rules.
  - key: VITE_FIREBASE_API_KEY
    value: AIzaSyDMn1dPIAAAdYiFSiAzUG65dg1o85w_A7Q
    scope: RUN_AND_BUILD_TIME
  - key: VITE_FIREBASE_AUTH_DOMAIN
    value: neuratalk-c6683.firebaseapp.com
    scope: RUN_AND_BUILD_TIME
  - key: VITE_FIREBASE_PROJECT_ID
    value: neuratalk-c6683
    scope: RUN_AND_BUILD_TIME
  - key: VITE_FIREBASE_STORAGE_BUCKET
    value: neuratalk-c6683.firebasestorage.app
    scope: RUN_AND_BUILD_TIME
  - key: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: "612487293092"
    scope: RUN_AND_BUILD_TIME
  - key: VITE_FIREBASE_MEASUREMENT_ID
    value: G-71G09M618D
    scope: RUN_AND_BUILD_TIME
  - key: VITE_FIREBASE_APP_ID
    value: 1:612487293092:web:2aa2cf6d2c33e74b335e31
    scope: RUN_AND_BUILD_TIME

  # ── Firebase Admin SDK (non-secret project identifier) ────────────────────────
  - key: FIREBASE_PROJECT_ID
    value: neuratalk-c6683
    scope: RUN_TIME

  # ── Email OTP (Resend) ───────────────────────────────────────────────────────
  - key: OTP_EMAIL_FROM
    value: noreply@neuratalk.in
    scope: RUN_TIME

  # ── MSG91 caller ID (non-secret outbound number) ─────────────────────────────
  - key: MSG91_VOICE_CALLER_ID
    value: "+918125557378"
    scope: RUN_TIME

  # ╔══════════════════════════════════════════════════════════════════════════════╗
  # ║  ENCRYPTED SECRETS — set these via DO dashboard → Apps → Settings → Secrets ║
  # ║  DO NOT add values here. These keys must exist as encrypted app secrets.    ║
  # ║                                                                              ║
  # ║  Required secrets:                                                           ║
  # ║    SESSION_SECRET          — 64+ char random string (openssl rand -hex 32)  ║
  # ║    SUPER_ADMIN_EMAIL       — super admin login email                         ║
  # ║    SUPER_ADMIN_PHONE       — super admin phone number                        ║
  # ║    SUPER_ADMIN_SECRET      — 32+ char random secret (openssl rand -hex 16)  ║
  # ║    DATABASE_URL            — Neon PostgreSQL connection string               ║
  # ║    REDIS_URL               — Upstash Redis URL (rediss://...)                ║
  # ║    LIVEKIT_API_KEY         — LiveKit server API key                          ║
  # ║    LIVEKIT_API_SECRET      — LiveKit server API secret                       ║
  # ║    OPENAI_API_KEY          — OpenAI API key                                  ║
  # ║    AI_INTEGRATIONS_OPENAI_API_KEY — OpenAI key for AI integrations           ║
  # ║    MSG91_AUTH_KEY          — MSG91 API key for PSTN/OTP                      ║
  # ║    MSG91_WEBHOOK_SECRET    — MSG91 webhook HMAC secret                       ║
  # ║    AZURE_SPEECH_KEY        — Azure Cognitive Services key                    ║
  # ║    AZURE_TRANSLATOR_KEY    — Azure Translator key                            ║
  # ║    RAZORPAY_KEY_ID         — Razorpay API key ID                             ║
  # ║    RAZORPAY_KEY_SECRET     — Razorpay API key secret                         ║
  # ║    RAZORPAY_WEBHOOK_SECRET — Razorpay webhook signing secret                 ║
  # ║    FIREBASE_SERVICE_ACCOUNT_JSON — Firebase Admin SDK service account JSON   ║
  # ║    TURN_SERVER_USERNAME    — TURN server username                            ║
  # ║    TURN_SERVER_CREDENTIAL  — TURN server credential                          ║
  # ║    SENTRY_DSN              — Sentry error monitoring DSN                     ║
  # ╚══════════════════════════════════════════════════════════════════════════════╝

services:
  - name: web
    github:
      repo: jagopro452-cloud/Neura-Talk
      branch: neuratalk-clean-release
      deploy_on_push: true
    build_command: npm ci --omit=dev
    run_command: node dist/index.cjs
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 5000
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
