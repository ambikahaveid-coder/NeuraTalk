name: neuratalk
region: blr
envs:
  # ── Runtime flags ────────────────────────────────────────────────────────────
  - key: NODE_ENV
    value: production
    scope: RUN_AND_BUILD_TIME
  - key: PORT
    value: "5000"
    scope: RUN_TIME
  - key: DOTENV_OVERRIDE
    value: "true"
    scope: RUN_AND_BUILD_TIME
  - key: ENABLE_STARTUP_SEEDING
    value: "true"
    scope: RUN_TIME
  - key: PREFER_LOCAL_AI
    value: "false"
    scope: RUN_TIME

  # ── Auth / OTP ───────────────────────────────────────────────────────────────
  - key: PHONE_OTP_PROVIDER
    value: firebase
    scope: RUN_AND_BUILD_TIME
  - key: VITE_PHONE_OTP_PROVIDER
    value: firebase
    scope: RUN_AND_BUILD_TIME

  # ── Azure Speech / STT ───────────────────────────────────────────────────────
  - key: STT_PROVIDER
    value: azure
    scope: RUN_TIME
  - key: ENABLE_DEEPGRAM_STT_FALLBACK
    value: "true"
    scope: RUN_TIME
  - key: AZURE_SPEECH_REGION
    value: centralindia
    scope: RUN_TIME
  - key: AZURE_TRANSLATOR_REGION
    value: centralindia
    scope: RUN_TIME

  # ── LiveKit ──────────────────────────────────────────────────────────────────
  - key: LIVEKIT_URL
    value: wss://neuratalk-vzgep7qq.livekit.cloud
    scope: RUN_TIME
  - key: LIVEKIT_SIP_DOMAIN
    value: 1m2u036kt9m.sip.livekit.cloud
    scope: RUN_TIME

  # ── OpenAI ───────────────────────────────────────────────────────────────────
  - key: AI_INTEGRATIONS_OPENAI_BASE_URL
    value: https://api.openai.com/v1
    scope: RUN_TIME

  # ── Admin seed account ───────────────────────────────────────────────────────
  - key: SUPER_ADMIN_EMAIL
    value: kiranatmakuri518@gmail.com
    scope: RUN_TIME
  - key: SUPER_ADMIN_PHONE
    value: "+918125557378"
    scope: RUN_TIME
